<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - AttendanceChimp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        form {
            display: inline-block;
            text-align: left;
        }

        p {
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <h1>Sign Up for AttendanceChimp</h1>

    <form action="/app/createUser" method="post">
        {% csrf_token %}

        <p>
            <label for="user_name">Username:</label>
            <input type="text" id="user_name" name="user_name" required>
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </p>

        <p>Account type:</p>

        <p>
            <input type="radio" id="student" name="is_student"
                   value="1" required>
            <label for="student">Student</label>
        </p>

        <p>
            <input type="radio" id="instructor" name="is_student"
                   value="0">
            <label for="instructor">Instructor</label>
        </p>

        <p>
            <button type="submit">Sign Up</button>
        </p>
    </form>
</body>
</html>
